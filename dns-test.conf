server:
    interface: 127.0.0.1
    port: 5353
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    access-control: 127.0.0.0/8 allow

    chroot: ""
    username: ""
    directory: "/tmp"

    use-syslog: no
    logfile: ""

    prefetch: no
    serve-expired: no

    verbosity: 1

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8954
    control-use-cert: no
